name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [contentful_publish]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            blog/package-lock.json
            package-lock.json

      - name: Install landing page dependencies
        run: npm ci

      - name: Build landing page CSS
        # Compiles Tailwind at build time for index.htm/waitlist.htm/
        # PrivacyPolicy/TermsOfService instead of the old cdn.tailwindcss.com
        # <script> - that was a render-blocking script flagged by Lighthouse
        # as delaying First Contentful Paint (and the CDN approach isn't
        # meant for production anyway - same reasoning as the blog's earlier
        # move off the CDN script to @tailwindcss/vite).
        run: npm run build:css

      - name: Install blog dependencies
        working-directory: blog
        run: npm ci

      - name: Build Astro blog
        working-directory: blog
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          # Copy static landing page files
          cp -r assets _site/
          cp *.htm _site/ 2>/dev/null || true
          cp CNAME _site/
          # FIX: `cp *.htm` is a flat glob - it never copied PrivacyPolicy/
          # or TermsOfService/, so both pages 404'd on the live site since
          # the very first deploy. Copying these subdirectories explicitly.
          cp -r PrivacyPolicy _site/
          cp -r TermsOfService _site/
          cp llms.txt _site/
          cp robots.txt _site/
          # Astro's `base: '/blog'` config prefixes internal links, but
          # doesn't change where files physically land - that's driven by
          # the actual src/pages/blog/... structure, which already builds
          # to blog/dist/blog/index.html. Copying into _site/ (not
          # _site/blog/) avoids double-nesting the path.
          cp -r blog/dist/. _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
