<section class="py-24 bg-gradient-to-b from-[#87CEEB] to-[#4A90E2] relative" id="platforms">
<div class="absolute -top-1 left-0 w-full h-12">
<svg viewBox="0 0 1200 100" preserveAspectRatio="none" class="w-full h-full">
<path d="M0,50 Q150,20 300,50 T600,50 T900,50 T1200,50 L1200,0 L0,0 Z" fill="#fdf5e6"/>
</svg>
</div>
<div class="absolute -bottom-1 left-0 w-full h-12">
<svg viewBox="0 0 1200 100" preserveAspectRatio="none" class="w-full h-full">
<path d="M0,30 Q200,60 400,30 T800,30 T1200,30 L1200,100 L0,100 Z" fill="#ffe8cc"/>
</svg>
</div>
<div class="container mx-auto px-6 lg:px-8 relative z-10">
<div class="text-center mb-12 relative z-10">
<h2 class="text-5xl md:text-6xl font-cartoon text-white drop-shadow-lg">Pick Your Beach 🏝️</h2>
<p class="mt-6 text-lg text-white max-w-2xl mx-auto drop-shadow">Ride the waves on every platform you love.</p>
</div>
<div class="flex flex-wrap justify-center items-center gap-8 min-h-[400px]">
<!-- Instagram -->
<div class="transform -rotate-6 -translate-y-8 scale-95 hover:rotate-0 hover:translate-y-0 hover:scale-100 transition-all duration-300">
<div class="bg-[var(--neutral-white)] p-6 rounded-3xl shadow-lg border-4 border-[var(--secondary-color)]">
<img src="./assets/imgs/instagram.png" alt="Instagram" class="w-16 h-16 object-contain">
</div>
</div>
<!-- LinkedIn -->
<div class="transform rotate-3 translate-y-12 scale-90 hover:rotate-0 hover:translate-y-0 hover:scale-100 transition-all duration-300">
<div class="bg-[var(--neutral-white)] p-6 rounded-3xl shadow-lg border-4 border-[var(--accent-color)]">
<img src="./assets/imgs/linkedin.png" alt="LinkedIn" class="w-16 h-16 object-contain">
</div>
</div>
<!-- Snapchat -->
<div class="transform -rotate-12 translate-y-6 scale-85 hover:rotate-0 hover:translate-y-0 hover:scale-100 transition-all duration-300">
<div class="bg-[var(--neutral-white)] p-6 rounded-3xl shadow-lg border-4 border-[var(--primary-color)]">
<img src="./assets/imgs/snapchat.png" alt="Snapchat" class="w-16 h-16 object-contain">
</div>
</div>
<!-- TikTok -->
<div class="transform scale-110 hover:scale-110 transition-all duration-300 z-10">
<div class="bg-[var(--secondary-color)] p-6 rounded-3xl shadow-xl border-4 border-white">
<img src="./assets/imgs/tiktok.png" alt="TikTok" class="w-16 h-16 object-contain">
</div>
</div>
<!-- X -->
<div class="transform -rotate-3 -translate-y-4 scale-92 hover:rotate-0 hover:translate-y-0 hover:scale-100 transition-all duration-300">
<div class="bg-[var(--neutral-white)] p-6 rounded-3xl shadow-lg border-4 border-[var(--accent-color)]">
<img src="./assets/imgs/twitter.png" alt="X" class="w-16 h-16 object-contain">
</div>
</div>
<!-- Meta -->
<div class="transform rotate-6 translate-y-10 scale-88 hover:rotate-0 hover:translate-y-0 hover:scale-100 transition-all duration-300">
<div class="bg-[var(--neutral-white)] p-6 rounded-3xl shadow-lg border-4 border-[var(--primary-color)]">
<img src="./assets/imgs/meta.png" alt="Meta" class="w-16 h-16 object-contain">
</div>
</div>
</div>
</div>
</section>
